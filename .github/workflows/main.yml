name: Jugantor Scraper — Daily 3 AM BST

on:
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:
    inputs:
      reset:
        description: "Reset DB and start from page 0? (yes/no)"
        required: false
        default: "no"

concurrency:
  group: jugantor-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests aiohttp tqdm colorama

      - name: Run scraper
        run: python scraper.py

      # ✅ FIXED SPLITTING STEP
      - name: Split oversized databases
        run: |
          python - << 'PYEOF'
          import sqlite3, os, glob

          MAX_BYTES = 50 * 1024 * 1024
          ws = os.getcwd()

          def get_all_dbs():
              return sorted(glob.glob("jugantor*.db"))

          def next_name():
              nums = [int("".join(filter(str.isdigit, f)) or "0") for f in get_all_dbs()]
              return f"jugantor{max(nums)+1 if nums else 1}.db"

          # ✅ FIXED HERE
          def clone_schema(src_conn, dst_conn):
              for (sql,) in src_conn.execute("""
                  SELECT sql FROM sqlite_master
                  WHERE type='table'
                  AND sql IS NOT NULL
                  AND name NOT LIKE 'sqlite_%'
              """):
                  dst_conn.execute(sql)
              dst_conn.commit()

          def split_db(path):
              print(f"Splitting {path}")
              src = sqlite3.connect(path)

              rows = [r[0] for r in src.execute("SELECT rowid FROM articles")]
              if not rows:
                  return

              mid = len(rows)//2
              move = rows[mid:]

              new_db = next_name()
              dst = sqlite3.connect(new_db)

              clone_schema(src, dst)

              cols = [c[1] for c in src.execute("PRAGMA table_info(articles)")]
              cs = ",".join(cols)
              ph = ",".join(["?"]*len(cols))

              for rid in move:
                  row = src.execute(f"SELECT {cs} FROM articles WHERE rowid=?", (rid,)).fetchone()
                  if row:
                      dst.execute(f"INSERT INTO articles ({cs}) VALUES ({ph})", row)

              dst.commit()
              dst.close()

              src.execute(f"DELETE FROM articles WHERE rowid >= ?", (move[0],))
              src.commit()
              src.close()

          for db in get_all_dbs():
              if os.path.getsize(db) > MAX_BYTES:
                  split_db(db)
          PYEOF

      - name: Commit DB
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add *.db || true
          git commit -m "Update DB" || true
          git push || true
