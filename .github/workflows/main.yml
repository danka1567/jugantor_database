- name: Split oversized databases
        run: |
          python - << 'PYEOF'
          import sqlite3, os, glob

          # Setting limit to 48MB to stay safely under the 50MB GitHub warning threshold
          MAX_BYTES = 48 * 1024 * 1024 
          
          def get_all_dbs():
              # This ensures we are looking in the current working directory (where scraper.py is)
              return sorted(glob.glob("jugantor*.db"))

          def get_next_name():
              dbs = get_all_dbs()
              nums = [int("".join(filter(str.isdigit, f)) or "0") for f in dbs]
              return f"jugantor{max(nums)+1 if nums else 1}.db"

          def split_logic(db_path):
              if os.path.getsize(db_path) <= MAX_BYTES:
                  return

              print(f"Splitting {db_path}...")
              
              conn = sqlite3.connect(db_path)
              cursor = conn.cursor()
              
              # Get total row count
              cursor.execute("SELECT count(*) FROM articles")
              total = cursor.fetchone()[0]
              
              if total < 2:
                  conn.close()
                  return

              # Create a new DB file
              new_db = get_next_name()
              
              # Attach the new DB to the current connection to move data efficiently
              cursor.execute(f"ATTACH DATABASE '{new_db}' AS second_db")
              
              # Clone the table structure
              schema = cursor.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='articles'").fetchone()[0]
              cursor.execute(f"CREATE TABLE second_db.articles {schema[schema.find('('):]}")
              
              # Move the older half of the data to the new file
              # (Assuming you want to keep the newest data in the primary/current file)
              limit = total // 2
              cursor.execute(f"INSERT INTO second_db.articles SELECT * FROM articles LIMIT {limit}")
              cursor.execute(f"DELETE FROM articles WHERE rowid IN (SELECT rowid FROM articles LIMIT {limit})")
              
              conn.commit()
              conn.close()

              # IMPORTANT: Vacuum the original DB to actually shrink the file size
              print(f"Shrinking {db_path}...")
              v_conn = sqlite3.connect(db_path)
              v_conn.execute("VACUUM")
              v_conn.close()

              # Recursively check if the files are still too big (e.g., if it was 150MB)
              split_logic(db_path)
              split_logic(new_db)

          for db in get_all_dbs():
              split_logic(db)
          PYEOF
